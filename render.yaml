# Render blueprint for the RiskLens backend (FastAPI).
# Deploy: push to GitHub, then on render.com -> "New +" -> "Blueprint" -> select this repo.
# Set DATABASE_URL (e.g. your Neon URL) and CORS_ORIGINS (your Vercel domain) in the dashboard.
services:
  - type: web
    name: risklens-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -e ./analytics && pip install -r backend/requirements.txt"
    startCommand: "python -m backend.app.seed --if-empty && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        sync: false          # set in dashboard (Neon/Render Postgres). SQLite fallback if unset.
      - key: SECRET_KEY
        generateValue: true  # Render generates a secure random value
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app
      - key: LLM_API_KEY
        sync: false
