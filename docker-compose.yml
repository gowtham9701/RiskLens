services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: risklens
      POSTGRES_PASSWORD: risklens
      POSTGRES_DB: risklens
    ports:
      - "5432:5432"
    volumes:
      - risklens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risklens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use the bundled Postgres by default; override with your Neon URL if desired.
      DATABASE_URL: ${DATABASE_URL:-postgresql://risklens:risklens@db:5432/risklens}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  risklens_pgdata:
